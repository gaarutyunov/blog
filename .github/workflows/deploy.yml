name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Allow the job to push the built site to the gh-pages branch, and read the
# same-owner @gaarutyunov/ui-kit package from GitHub Packages with GITHUB_TOKEN.
permissions:
  contents: write
  packages: read

# Never run two production deploys at once.
concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@gaarutyunov"

      - name: Install dependencies
        # @gaarutyunov/ui-kit lives on GitHub Packages; GH_TOKEN is the repo PAT
        # already used by claude.yml and must carry read:packages (GITHUB_TOKEN
        # fallback works for same-owner packages).
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          # Preserve PR preview subtrees when publishing production.
          clean: true
          clean-exclude: |
            pr-preview
