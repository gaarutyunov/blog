name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

permissions:
  contents: write
  packages: read
  pull-requests: write

# One preview deploy per PR at a time.
concurrency:
  group: pr-preview-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@gaarutyunov"

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build with preview base path
        if: github.event.action != 'closed'
        run: npm run build
        env:
          # Astro emits absolute asset URLs; prefix them with the preview
          # subpath so assets resolve under /pr-preview/pr-<N>/.
          BASE_PATH: /pr-preview/pr-${{ github.event.number }}/

      - name: Deploy / teardown preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: ./dist/
          umbrella-dir: pr-preview
